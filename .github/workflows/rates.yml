name: Update Exchange Rates

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Fetch exchange rates
        run: node rates.js
        env:
          EXCHANGE_API_KEY: ${{ vars.EXCHANGE_API_KEY }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Updated exchange rates'
          file_pattern: 'static/rates/*.json'
